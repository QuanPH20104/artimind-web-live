name: publish

on:
  schedule:
    # 2 min after each BigQuery refresh (scheduled query runs at :x4, ~75 s)
    - cron: '6-59/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}
          token_format: access_token

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node build.mjs
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
