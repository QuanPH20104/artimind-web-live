name: publish

on:
  schedule:
    # Backup only: GitHub cron is best-effort (often late or skipped). The real 10-min
    # cadence is the `next` job below, which re-dispatches this workflow at the next :x6.
    - cron: '6-59/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

env:
  # The chain stops here (10:00 Vietnam time). After it, only pushes / manual runs publish.
  STOP_AT: '2026-10-27T03:00:00Z'

permissions:
  actions: write
  contents: read
  id-token: write
  pages: write

jobs:
  # The backup cron must not restart the chain after STOP_AT.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date +%s)" -ge "$(date -d "$STOP_AT" +%s)" ]; then
            echo "Past STOP_AT; skipping the backup cron run."
            echo go=false >> "$GITHUB_OUTPUT"
          else
            echo go=true >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}
          token_format: access_token

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node build.mjs
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # Self-scheduling chain: wait for the next :x6 (2 min after the BigQuery refresh at :x4),
  # then dispatch the next run. workflow_dispatch is one of the events GITHUB_TOKEN may trigger.
  # If a newer run is already active (push, cron, manual), it owns the chain and this one stops,
  # so duplicate chains collapse to one.
  next:
    needs: [gate, publish]
    if: ${{ !cancelled() && needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the next :x6
        run: |
          now=$(date +%s)
          next=$(( ( (now - 360) / 600 + 1 ) * 600 + 360 ))
          if [ "$next" -ge "$(date -d "$STOP_AT" +%s)" ]; then
            echo "Next slot is past STOP_AT ($STOP_AT); the chain ends here."
            echo STOP=1 >> "$GITHUB_ENV"
            exit 0
          fi
          echo "next run at $(date -u -d @$next +%H:%M:%S) UTC"
          sleep $(( next - now ))

      - name: Dispatch the next run
        if: ${{ env.STOP != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          newer=$(gh api "repos/$GH_REPO/actions/workflows/publish.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id > ${{ github.run_id }} and .status != \"completed\")] | length")
          if [ "$newer" -gt 0 ]; then
            echo "A newer run is active; it continues the chain."
            exit 0
          fi
          gh workflow run publish.yml --ref main
